name: Publish to PyPI

on:
  release:
    types: [created]

# Workflow-level default — no ambient permissions. The publish job opts into
# id-token: write below (needed for PyPI trusted publishing).
permissions:
  contents: read

jobs:
  publish:
    name: Build and Publish
    runs-on: ubuntu-latest
    # Bound to the `release` environment so its deployment tag policy
    # admits only `v[0-9]+.[0-9]+.[0-9]+` refs, its env-scoped secrets
    # scope, and its OIDC token carries `environment:release` — which the
    # PyPI trusted-publisher registration matches on.
    environment: release
    permissions:
      id-token: write  # PyPI trusted publishing (OIDC)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install hatch

      - name: Verify version matches tag
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          PKG_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Error: Tag version ($TAG_VERSION) does not match package version ($PKG_VERSION)"
            exit 1
          fi
          echo "Version verified: $PKG_VERSION"

      - name: Build package
        run: hatch build

      # Trusted publishing consumes the OIDC id-token grant above; no
      # long-lived PYPI_API_TOKEN needed. Requires trusted-publisher
      # registration on PyPI first — see report §"Pre-requisites".
      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
